<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Grudge Studio · Admin Harbor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════
   ROOT TOKENS
═══════════════════════════════════════════════════ */
:root {
  --void: #050810;
  --abyss: #081421;
  --deep: #0d1f33;
  --shallow: #16314d;
  --foam: #2a4d70;
  --ink: #e8e1d0;
  --ink-dim: #8a8377;
  --ink-faint: #4a4538;
  --blood: #c41230;
  --blood-deep: #8b0a1a;
  --gold: #c9a961;
  --gold-bright: #e8c878;
  --bone: #d4c8a8;
  --rust: #6b3410;
  --teal: #4a8a82;
  --green-live: #4ade80;
  --orange-warn: #f59e0b;
  --red-down: #ef4444;
  --border: #2a2438;
  --console-bg: #0a0e18;
  --captain-bg: #0c1220;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--void); color: var(--ink); font-family: 'JetBrains Mono', monospace; overflow: hidden; }

/* ═══════════════════════════════════════════════════
   ANIMATED WATER BACKGROUND
═══════════════════════════════════════════════════ */
@keyframes waterShift {
  0%   { background-position: 0% 0%, 100% 100%, 50% 50%; }
  50%  { background-position: 100% 50%, 0% 50%, 80% 20%; }
  100% { background-position: 0% 0%, 100% 100%, 50% 50%; }
}
@keyframes waveRipple {
  0%   { transform: translate(-50%, -50%) scale(1); opacity: 0.04; }
  50%  { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 0.04; }
}

/* ═══════════════════════════════════════════════════
   VESSEL ANIMATIONS
═══════════════════════════════════════════════════ */
@keyframes float {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50%      { transform: translate(-50%, -50%) translateY(-3px); }
}
@keyframes floatSlow {
  0%, 100% { transform: translate(-50%, -50%) translateY(0) rotate(0deg); }
  25%      { transform: translate(-50%, -50%) translateY(-2px) rotate(0.5deg); }
  75%      { transform: translate(-50%, -50%) translateY(-1px) rotate(-0.5deg); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.5; transform: scale(0.85); }
}
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 6px currentColor; }
  50%      { box-shadow: 0 0 14px currentColor, 0 0 28px currentColor; }
}
@keyframes dataFlow {
  0%   { offset-distance: 0%; opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { offset-distance: 100%; opacity: 0; }
}
@keyframes scanLine {
  0%   { top: 0; }
  100% { top: 100%; }
}
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0; }
}
@keyframes spinCompass {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ═══════════════════════════════════════════════════
   TOP BAR
═══════════════════════════════════════════════════ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 56px; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  background: linear-gradient(180deg, rgba(5,8,16,0.97), rgba(5,8,16,0.8));
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(201,169,97,0.25);
}
.brand { display: flex; align-items: center; gap: 10px; }
.compass {
  width: 34px; height: 34px;
  border: 1.5px solid var(--gold);
  border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle, var(--abyss), var(--void));
  position: relative;
}
.compass-inner {
  width: 18px; height: 18px;
  border: 1px dashed rgba(201,169,97,0.4);
  border-radius: 50%;
  display: grid; place-items: center;
  animation: spinCompass 20s linear infinite;
}
.compass-inner span { font-size: 10px; animation: spinCompass 20s linear infinite reverse; }
.brand-text h1 {
  font-family: 'Cinzel', serif;
  font-size: 13px; letter-spacing: 0.3em;
  color: var(--bone);
}
.brand-text small {
  font-size: 8px; letter-spacing: 0.35em; color: var(--gold);
  text-transform: uppercase;
}
.topbar-center {
  display: flex; align-items: center; gap: 16px;
}
.fleet-stat {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; letter-spacing: 0.1em;
}
.fleet-stat .dot { width: 7px; height: 7px; border-radius: 50%; }
.fleet-stat .dot.live { background: var(--green-live); box-shadow: 0 0 6px var(--green-live); }
.fleet-stat .dot.warn { background: var(--orange-warn); }
.fleet-stat .dot.down { background: var(--red-down); }
.fleet-stat .dot.unknown { background: var(--ink-dim); }
.fleet-stat .count { color: var(--bone); font-weight: 700; }
.fleet-stat .lbl { color: var(--ink-dim); }
.topbar-controls { display: flex; align-items: center; gap: 8px; }
.ctrl-btn {
  padding: 6px 12px;
  background: rgba(13,31,51,0.6);
  border: 1px solid var(--border);
  color: var(--ink-dim);
  font-family: inherit; font-size: 9px; letter-spacing: 0.18em;
  text-transform: uppercase; cursor: pointer;
  transition: all 0.2s;
}
.ctrl-btn:hover { border-color: var(--gold); color: var(--bone); background: rgba(201,169,97,0.08); }
.ctrl-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,169,97,0.12); }
.ctrl-btn.danger { border-color: var(--blood); color: var(--bone); }
.ctrl-btn.danger:hover { background: rgba(196,18,48,0.2); color: #fff; }
.ctrl-btn.success { border-color: var(--green-live); color: var(--green-live); }
.ctrl-btn.success:hover { background: rgba(74,222,128,0.1); }
.ctrl-group { display: flex; gap: 3px; padding: 3px; background: rgba(8,20,33,0.6); border: 1px solid var(--border); }
.ctrl-group .ctrl-btn { padding: 4px 8px; font-size: 8px; border: 1px solid transparent; }

/* ═══════════════════════════════════════════════════
   STAGE — OCEAN
═══════════════════════════════════════════════════ */
.stage {
  position: absolute;
  top: 56px; left: 0; right: 340px; bottom: 240px;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(74,138,130,0.06) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(196,18,48,0.03) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(201,169,97,0.02) 0%, transparent 70%),
    linear-gradient(180deg, var(--void) 0%, #060d18 30%, #081420 60%, var(--deep) 100%);
  animation: waterShift 60s ease-in-out infinite;
  cursor: grab;
}
.stage.dragging { cursor: grabbing; }
.stage.right-collapsed { right: 0; }
.stage.console-collapsed { bottom: 0; }

/* Nautical grid */
.stage::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(201,169,97,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,169,97,0.035) 1px, transparent 1px);
  background-size: 80px 80px;
  pointer-events: none;
}
/* Noise overlay */
.stage::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
  opacity: 0.025; mix-blend-mode: overlay;
}

.canvas {
  position: absolute; top: 0; left: 0;
  width: 3200px; height: 2400px;
  transform-origin: 0 0;
  transition: transform 0.08s ease-out;
}
.canvas.no-transition { transition: none; }

/* SVG layers */
.connections-svg {
  position: absolute; top: 0; left: 0;
  width: 3200px; height: 2400px;
  pointer-events: none; z-index: 1;
}
.conn-line { fill: none; stroke-width: 1.5; opacity: 0.3; transition: opacity 0.2s, stroke-width 0.2s; }
.conn-line.active { stroke: var(--green-live); }
.conn-line.degraded { stroke: var(--orange-warn); stroke-dasharray: 6 4; }
.conn-line.broken { stroke: var(--red-down); stroke-dasharray: 3 3; opacity: 0.6; }
.conn-line.unverified { stroke: var(--gold); stroke-dasharray: 2 6; opacity: 0.35; }
.conn-line.highlight { opacity: 1; stroke-width: 2.5; }

/* Data flow dots on connections */
.data-dot {
  r: 3; fill: var(--green-live); opacity: 0;
  offset-rotate: 0deg;
  animation: dataFlow 3s linear infinite;
}
.data-dot.warn { fill: var(--orange-warn); }
.data-dot.broken { fill: var(--red-down); animation: none; opacity: 0; }

/* Region backdrops */
.region { position: absolute; pointer-events: none; z-index: 0; }
.region-bounds {
  position: absolute;
  border: 1px dashed rgba(201,169,97,0.12);
  background: radial-gradient(ellipse at center, rgba(201,169,97,0.02) 0%, transparent 70%);
  transition: border-color 0.3s, background 0.3s;
}
.region-bounds:hover { border-color: rgba(201,169,97,0.25); }
.region-label {
  position: absolute;
  font-family: 'Cinzel', serif; font-size: 12px;
  letter-spacing: 0.4em; color: rgba(201,169,97,0.45);
  text-transform: uppercase; white-space: nowrap;
}
.region-label small {
  display: block; font-family: 'Cormorant Garamond', serif;
  font-style: italic; font-size: 11px; letter-spacing: 0.08em;
  color: rgba(138,131,119,0.5); margin-top: 3px;
}

/* ═══════════════════════════════════════════════════
   VESSELS
═══════════════════════════════════════════════════ */
.vessel {
  position: absolute; cursor: pointer;
  transform: translate(-50%, -50%);
  z-index: 2; transition: filter 0.2s; user-select: none;
}
.vessel.floating { animation: floatSlow 7s ease-in-out infinite; }
.vessel:hover { z-index: 5; filter: drop-shadow(0 0 14px var(--gold)); }
.vessel.selected { z-index: 6; filter: drop-shadow(0 0 20px var(--gold-bright)); }
.vessel.muted { opacity: 0.15; pointer-events: none; }
.vessel svg { display: block; overflow: visible; }
.vessel-label {
  position: absolute; top: 100%; left: 50%;
  transform: translate(-50%, 6px);
  font-family: 'Cinzel', serif; font-size: 9px;
  letter-spacing: 0.15em; color: var(--bone);
  text-transform: uppercase; white-space: nowrap;
  text-shadow: 0 0 6px var(--void), 0 1px 3px var(--void);
  pointer-events: none;
}
.vessel-status-dot {
  position: absolute; top: -5px; right: -5px;
  width: 10px; height: 10px; border-radius: 50%;
  border: 1.5px solid var(--void); pointer-events: none;
}
.vessel-status-dot.live { background: var(--green-live); box-shadow: 0 0 6px var(--green-live); animation: pulse 2.5s infinite; }
.vessel-status-dot.warn { background: var(--orange-warn); box-shadow: 0 0 6px var(--orange-warn); animation: pulse 1.5s infinite; }
.vessel-status-dot.down { background: var(--red-down); box-shadow: 0 0 8px var(--red-down); animation: pulse 1s infinite; }
.vessel-status-dot.unknown { background: var(--ink-dim); }

/* ═══════════════════════════════════════════════════
   INSPECTOR (right panel)
═══════════════════════════════════════════════════ */
.inspector {
  position: fixed; top: 56px; right: 0; bottom: 240px;
  width: 340px;
  background: linear-gradient(180deg, var(--abyss) 0%, var(--void) 100%);
  border-left: 1px solid rgba(201,169,97,0.2);
  z-index: 50; overflow-y: auto; transition: transform 0.3s;
}
.inspector.collapsed { transform: translateX(100%); }
.inspector-toggle {
  position: fixed; right: 340px; top: 70px; z-index: 51;
  width: 22px; height: 50px;
  background: var(--abyss); border: 1px solid var(--border); border-right: none;
  color: var(--gold); cursor: pointer; font-family: inherit;
  transition: right 0.3s; display: grid; place-items: center; font-size: 12px;
}
.inspector.collapsed + .inspector-toggle,
.inspector-toggle.collapsed-state { right: 0; }

.ins-header {
  padding: 20px 16px 14px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, rgba(13,31,51,0.5), transparent);
}
.ins-eyebrow { font-size: 8px; letter-spacing: 0.5em; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; }
.ins-title { font-family: 'Cinzel', serif; font-size: 16px; letter-spacing: 0.1em; color: var(--bone); text-transform: uppercase; }
.ins-sub { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 12px; color: var(--ink-dim); margin-top: 3px; }
.ins-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
.ins-section h4 {
  font-family: 'Cinzel', serif; font-size: 9px;
  letter-spacing: 0.35em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 10px;
}
.ins-row {
  display: flex; justify-content: space-between;
  padding: 5px 0; font-size: 10px;
  border-bottom: 1px solid rgba(42,36,56,0.3);
}
.ins-row:last-child { border-bottom: none; }
.ins-row .key { color: var(--ink-dim); letter-spacing: 0.08em; }
.ins-row .val { color: var(--bone); font-weight: 500; }
.ins-row .val.mono { font-family: 'JetBrains Mono', monospace; color: var(--gold); font-size: 9px; }

/* Admin action buttons inside inspector */
.admin-actions { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.admin-btn {
  padding: 5px 10px; font-family: 'JetBrains Mono', monospace;
  font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase;
  border: 1px solid var(--border); background: rgba(13,31,51,0.6);
  color: var(--ink-dim); cursor: pointer; transition: all 0.15s;
}
.admin-btn:hover { border-color: var(--gold); color: var(--bone); background: rgba(201,169,97,0.08); }
.admin-btn.restart { border-color: var(--orange-warn); color: var(--orange-warn); }
.admin-btn.restart:hover { background: rgba(245,158,11,0.15); }
.admin-btn.deploy { border-color: var(--green-live); color: var(--green-live); }
.admin-btn.deploy:hover { background: rgba(74,222,128,0.1); }
.admin-btn.danger { border-color: var(--red-down); color: var(--red-down); }
.admin-btn.danger:hover { background: rgba(239,68,68,0.1); }
.admin-btn.info { border-color: var(--teal); color: var(--teal); }
.admin-btn.info:hover { background: rgba(74,138,130,0.1); }
.admin-btn:active { transform: scale(0.95); }

.conn-list { display: flex; flex-direction: column; gap: 4px; }
.conn-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px; background: rgba(13,31,51,0.4);
  border: 1px solid var(--border); border-left: 3px solid;
  font-size: 10px; cursor: pointer; transition: all 0.15s;
}
.conn-item:hover { background: rgba(13,31,51,0.7); transform: translateX(2px); }
.conn-item.active { border-left-color: var(--green-live); }
.conn-item.degraded { border-left-color: var(--orange-warn); }
.conn-item.broken { border-left-color: var(--red-down); }
.conn-item.unverified { border-left-color: var(--gold); }
.conn-item .arrow { color: var(--ink-faint); font-size: 11px; }
.conn-item .name { color: var(--bone); flex: 1; font-family: 'Cinzel', serif; letter-spacing: 0.08em; font-size: 9px; text-transform: uppercase; }
.conn-item .status { font-size: 7px; color: var(--ink-dim); letter-spacing: 0.15em; text-transform: uppercase; }

.stat-tag {
  display: inline-block; padding: 2px 7px;
  font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; border: 1px solid;
}
.stat-tag.live { color: var(--green-live); border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.08); }
.stat-tag.warn { color: var(--orange-warn); border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.08); }
.stat-tag.down { color: var(--red-down); border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.08); }
.stat-tag.unknown { color: var(--ink-dim); border-color: var(--border); }

.empty-ins { padding: 40px 20px; text-align: center; }
.empty-ins-icon { font-size: 30px; color: var(--ink-faint); margin-bottom: 12px; }
.empty-ins h3 { font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.2em; color: var(--bone); margin-bottom: 6px; }
.empty-ins p { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 13px; color: var(--ink-dim); line-height: 1.4; }

.health-bar { display: flex; height: 6px; background: var(--abyss); border: 1px solid var(--border); overflow: hidden; margin-top: 6px; }
.health-bar-seg { transition: flex 0.4s; }
.health-bar-seg.live { background: var(--green-live); }
.health-bar-seg.warn { background: var(--orange-warn); }
.health-bar-seg.down { background: var(--red-down); }
.health-bar-seg.unknown { background: var(--ink-dim); }

/* ═══════════════════════════════════════════════════
   COMMAND CONSOLE (bottom dock)
═══════════════════════════════════════════════════ */
.console-dock {
  position: fixed; left: 0; right: 340px; bottom: 0;
  height: 240px; z-index: 60;
  display: flex; flex-direction: column;
  background: var(--console-bg);
  border-top: 1px solid rgba(201,169,97,0.25);
  transition: transform 0.3s, right 0.3s;
}
.console-dock.collapsed { transform: translateY(100%); }
.console-dock.right-collapsed { right: 0; }

.console-tabs {
  display: flex; align-items: center;
  height: 30px; min-height: 30px;
  background: rgba(5,8,16,0.9);
  border-bottom: 1px solid var(--border);
  padding: 0 12px; gap: 2px;
}
.console-tab {
  padding: 4px 12px; font-family: inherit; font-size: 8px;
  letter-spacing: 0.2em; text-transform: uppercase;
  background: transparent; border: none; color: var(--ink-dim);
  cursor: pointer; border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.console-tab:hover { color: var(--bone); }
.console-tab.active { color: var(--gold); border-bottom-color: var(--gold); }
.console-toggle-btn {
  margin-left: auto; background: transparent; border: none;
  color: var(--gold); cursor: pointer; font-family: inherit;
  font-size: 10px; padding: 4px 8px;
}
.console-body {
  flex: 1; overflow-y: auto; padding: 8px 14px;
  font-size: 11px; line-height: 1.6;
}
.console-body .log-line { animation: fadeSlideUp 0.2s ease-out; }
.log-time { color: var(--ink-faint); margin-right: 8px; font-size: 9px; }
.log-ok { color: var(--green-live); }
.log-warn { color: var(--orange-warn); }
.log-err { color: var(--red-down); }
.log-info { color: var(--teal); }
.log-ai { color: #a78bfa; }
.log-cmd { color: var(--gold); }

.console-input-row {
  display: flex; align-items: center;
  height: 30px; min-height: 30px;
  border-top: 1px solid var(--border);
  padding: 0 12px;
  background: rgba(5,8,16,0.7);
}
.console-prompt { color: var(--gold); font-size: 11px; margin-right: 8px; }
.console-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--bone); font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}
.console-input::placeholder { color: var(--ink-faint); }

/* ═══════════════════════════════════════════════════
   AI CAPTAIN PANEL (overlaid in inspector)
═══════════════════════════════════════════════════ */
.captain-panel {
  background: linear-gradient(180deg, rgba(12,18,32,0.95), rgba(5,8,16,0.95));
  border: 1px solid rgba(167,139,250,0.2);
  border-left: 3px solid #a78bfa;
  margin: 8px;
  overflow: hidden;
}
.captain-header {
  padding: 10px 12px;
  display: flex; align-items: center; gap: 8px;
  background: rgba(167,139,250,0.06);
  border-bottom: 1px solid rgba(167,139,250,0.15);
}
.captain-avatar {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, #7c3aed, #a78bfa);
  display: grid; place-items: center;
  font-size: 13px; color: #fff;
  box-shadow: 0 0 10px rgba(167,139,250,0.4);
}
.captain-name {
  font-family: 'Cinzel', serif; font-size: 10px;
  letter-spacing: 0.2em; color: #c4b5fd;
  text-transform: uppercase;
}
.captain-status {
  font-size: 8px; color: var(--green-live);
  letter-spacing: 0.15em;
}
.captain-body {
  padding: 10px 12px; max-height: 200px; overflow-y: auto;
}
.captain-msg {
  font-size: 11px; line-height: 1.5; color: var(--bone);
  margin-bottom: 8px;
  animation: fadeSlideUp 0.3s ease-out;
}
.captain-msg .highlight { color: #a78bfa; font-weight: 500; }
.captain-msg .critical { color: var(--red-down); font-weight: 700; }
.captain-msg .ok { color: var(--green-live); }

/* ═══════════════════════════════════════════════════
   LEGEND
═══════════════════════════════════════════════════ */
.legend {
  position: fixed; bottom: 256px; left: 12px;
  background: rgba(8,20,33,0.9); backdrop-filter: blur(10px);
  border: 1px solid rgba(201,169,97,0.2);
  padding: 12px 14px; z-index: 40; max-width: 240px;
  transition: bottom 0.3s;
}
.legend.console-collapsed { bottom: 16px; }
.legend h4 { font-family: 'Cinzel', serif; font-size: 8px; letter-spacing: 0.35em; color: var(--gold); margin-bottom: 8px; text-transform: uppercase; }
.legend-row { display: flex; align-items: center; gap: 6px; font-size: 9px; color: var(--ink-dim); margin-bottom: 4px; letter-spacing: 0.04em; }
.legend-line { width: 20px; height: 2px; flex-shrink: 0; }
.legend-line.active { background: var(--green-live); }
.legend-line.degraded { background: var(--orange-warn); border-top: 1px dashed var(--orange-warn); height: 0; }
.legend-line.broken { background: repeating-linear-gradient(90deg, var(--red-down) 0 3px, transparent 3px 6px); }
.legend-line.unverified { background: repeating-linear-gradient(90deg, var(--gold) 0 2px, transparent 2px 8px); }
.legend-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.legend-dot.live { background: var(--green-live); box-shadow: 0 0 4px var(--green-live); }
.legend-dot.warn { background: var(--orange-warn); }
.legend-dot.down { background: var(--red-down); }
.legend-dot.unknown { background: var(--ink-dim); }

/* ═══════════════════════════════════════════════════
   ZOOM CONTROLS
═══════════════════════════════════════════════════ */
.zoom-pad {
  position: fixed; bottom: 256px; right: 356px;
  display: flex;
  background: rgba(8,20,33,0.9); backdrop-filter: blur(10px);
  border: 1px solid rgba(201,169,97,0.2);
  z-index: 40; transition: bottom 0.3s, right 0.3s;
}
.zoom-pad.collapsed { right: 16px; }
.zoom-pad.console-collapsed { bottom: 16px; }
.zoom-pad button {
  width: 32px; height: 32px; background: transparent; border: none;
  color: var(--bone); font-family: inherit; font-size: 13px;
  cursor: pointer; border-right: 1px solid var(--border);
}
.zoom-pad button:last-child { border-right: none; }
.zoom-pad button:hover { background: rgba(201,169,97,0.1); color: var(--gold); }
.zoom-pad .zoom-display {
  display: grid; place-items: center; padding: 0 10px;
  font-size: 10px; color: var(--gold); border-right: 1px solid var(--border); min-width: 48px;
}

/* ═══════════════════════════════════════════════════
   MINIMAP
═══════════════════════════════════════════════════ */
.minimap {
  position: fixed; bottom: 256px; left: 12px; margin-top: 8px;
  width: 180px; height: 120px;
  background: rgba(5,8,16,0.9);
  border: 1px solid rgba(201,169,97,0.2);
  z-index: 40; overflow: hidden;
  transition: bottom 0.3s;
  display: none; /* shown via JS when zoomed */
}
.minimap.console-collapsed { bottom: 16px; }
.minimap canvas { width: 100%; height: 100%; }
.minimap-viewport {
  position: absolute; border: 1px solid var(--gold);
  background: rgba(201,169,97,0.06); pointer-events: none;
}

/* ═══════════════════════════════════════════════════
   SCROLLBAR
═══════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--void); }
::-webkit-scrollbar-thumb { background: var(--border); }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }

/* ═══════════════════════════════════════════════════
   UTILITY
═══════════════════════════════════════════════════ */
.hidden { display: none !important; }
.cursor-blink::after { content: '▊'; animation: blink 1s step-end infinite; color: var(--gold); }
</style>

function vesselSvg(kind, size, status) {
  const unit = 18 + size * 6;
  const beam = 0.55;
  const w = unit * 1.6, h = unit * 1.6;
  const cx = w/2, cy = h/2, len = unit, wid = unit * beam;
  const hullColor = {live:'#3a2820',warn:'#3a2820',down:'#2a1a14',unknown:'#1a1410'}[status]||'#3a2820';
  const deckColor = {live:'#5a3a26',warn:'#5a3a26',down:'#3a2418',unknown:'#2a1e16'}[status]||'#5a3a26';
  const trim = '#c9a961';

   CONSOLE LOG ENGINE
════════════════════════════════════════════════════════════════ */
const consoleLogs = { logs: [], captain: [], network: [], docs: [] };

function logTo(tab, cls, msg) {
  const ts = new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});
  consoleLogs[tab].push({ ts, cls, msg });
  if (consoleLogs[tab].length > 500) consoleLogs[tab].shift();
  if (state.consoleTab === tab) renderConsole();
}
function log(cls, msg) { logTo('logs', cls, msg); }
function logCaptain(cls, msg) { logTo('captain', cls, msg); }
function logNetwork(cls, msg) { logTo('network', cls, msg); }
function logDocs(cls, msg) { logTo('docs', cls, msg); }

function renderConsole() {
  const entries = consoleLogs[state.consoleTab] || [];
  consoleBody.innerHTML = entries.map(e =>
    `<div class="log-line"><span class="log-time">${e.ts}</span><span class="log-${e.cls}">${e.msg}</span></div>`
  ).join('');
  consoleBody.scrollTop = consoleBody.scrollHeight;
}

/* ════════════════════════════════════════════════════════════════
   ADMIN ACTION HANDLERS
════════════════════════════════════════════════════════════════ */
function adminAction(action, vesselId) {
  const v = lookup[vesselId];
  if (!v) { log('err', `Unknown vessel: ${vesselId}`); return; }

  switch(action) {
    case 'health': {
      const url = v.healthCheck || v.endpoint;
      if (!url) { log('warn', `No health endpoint for ${v.name}`); return; }
      log('cmd', `› curl ${url}`);
      log('info', `Checking health of ${v.name}...`);
      // Simulate health check
      setTimeout(() => {
        if (v.status === 'live') {
          log('ok', `✓ ${v.name} — 200 OK (${Math.floor(Math.random()*80+20)}ms)`);
          logNetwork('ok', `HEALTH ${v.name} → 200 OK`);
        } else if (v.status === 'warn') {
          log('warn', `⚠ ${v.name} — 200 OK but degraded (${Math.floor(Math.random()*800+200)}ms)`);
          logNetwork('warn', `HEALTH ${v.name} → 200 SLOW`);
        } else if (v.status === 'down') {
          log('err', `✗ ${v.name} — Connection refused / 503`);
          logNetwork('err', `HEALTH ${v.name} → 503 / ECONNREFUSED`);
        } else {
          log('warn', `? ${v.name} — No response (timeout 5s)`);
          logNetwork('warn', `HEALTH ${v.name} → TIMEOUT`);
        }
      }, 600 + Math.random() * 1400);
      break;
    }
    case 'restart': {
      if (!v.restartCmd) { log('warn', `No restart command for ${v.name}`); return; }
      log('cmd', `› ${v.restartCmd}`);
      log('warn', `Restarting ${v.name}...`);
      logCaptain('ai', `CAPTAIN: Initiating restart sequence for ${v.name}`);
      setTimeout(() => {
        if (v.status === 'down') {
          log('warn', `⟳ ${v.name} — Restart issued. Container pulling...`);
          setTimeout(() => {
            log('ok', `✓ ${v.name} — Container started. Waiting for health...`);
            setTimeout(() => {
              // Simulate: sometimes it comes back, sometimes it doesn't
              const success = Math.random() > 0.4;
              if (success) {
                v.status = 'live';
                log('ok', `✓✓ ${v.name} — HEALTHY. Service restored.`);
                logCaptain('ok', `CAPTAIN: ${v.name} has been revived. Updating fleet status.`);
                renderVessels(); renderConnections(); updateTopbarStats();
              } else {
                log('err', `✗ ${v.name} — Health check failed after restart. Still 503.`);
                logCaptain('err', `CAPTAIN: ${v.name} restart failed. Likely config or dependency issue. Check logs.`);
              }
            }, 2000);
          }, 1500);
        } else {
          log('ok', `✓ ${v.name} — Restart complete. Service healthy.`);
        }
      }, 800);
      break;
    }
    case 'deploy': {
      if (!v.deployCmd) { log('warn', `No deploy command for ${v.name}`); return; }
      log('cmd', `› ${v.deployCmd}`);
      log('info', `Deploying ${v.name}...`);
      logCaptain('ai', `CAPTAIN: Deployment initiated for ${v.name}. Building...`);
      setTimeout(() => {
        log('info', `  Building... (${v.stack})`);
        setTimeout(() => {
          log('info', `  Uploading...`);
          setTimeout(() => {
            log('ok', `✓ ${v.name} — Deployed successfully.`);
            logCaptain('ok', `CAPTAIN: ${v.name} deployment complete. Running post-deploy checks.`);
            if (v.status === 'down' || v.status === 'unknown') {
              v.status = 'warn';
              renderVessels(); updateTopbarStats();
            }
          }, 1200);
        }, 1500);
      }, 1000);
      break;
    }
    case 'logs': {
      if (!v.logCmd) { log('warn', `No log command for ${v.name}`); return; }
      log('cmd', `› ${v.logCmd}`);
      log('info', `Fetching logs for ${v.name}...`);
      setTimeout(() => {
        const sampleLogs = v.status === 'down' ? [
          `[ERROR] ECONNREFUSED 127.0.0.1:3306 — MySQL connection failed`,
          `[ERROR] Health check failed: port ${v.endpoint?.match(/:(\d+)/)?.[1]||'???'} not listening`,
          `[WARN]  Container exited with code 1 — restarting in 30s`,
          `[ERROR] Environment variable DATABASE_URL not set`,
          `[INFO]  Retry attempt 47/∞...`,
        ] : v.status === 'warn' ? [
          `[WARN]  Response time degraded: avg 820ms (threshold: 500ms)`,
          `[INFO]  Connection pool: 8/10 active`,
          `[WARN]  Memory usage: 78% (1.2GB / 1.5GB)`,
          `[INFO]  Requests: 142/min`,
        ] : [
          `[INFO]  Service healthy. Uptime: ${Math.floor(Math.random()*72+1)}h`,
          `[INFO]  Requests: ${Math.floor(Math.random()*500+50)}/min`,
          `[INFO]  Response avg: ${Math.floor(Math.random()*80+15)}ms`,
          `[INFO]  Memory: ${Math.floor(Math.random()*40+20)}%`,
        ];
        sampleLogs.forEach((l, i) => {
          setTimeout(() => log(l.includes('ERROR') ? 'err' : l.includes('WARN') ? 'warn' : 'info', `  ${l}`), i * 200);
        });
      }, 500);
      break;
    }
    case 'docs': {
      logDocs('info', `═══ DOCUMENTATION: ${v.name} ═══`);
      logDocs('info', `Type: ${v.type} | Stack: ${v.stack}`);
      logDocs('info', `Region: ${REGIONS.find(r=>r.id===v.region)?.name||'—'}`);
      if (v.endpoint) logDocs('info', `Endpoint: ${v.endpoint}`);
      if (v.healthCheck) logDocs('info', `Health: ${v.healthCheck}`);
      if (v.docs) logDocs('ok', v.docs);
      if (v.notes) logDocs('warn', `⚠ Note: ${v.notes}`);

      // Show connections
      const fromConns = CONNECTIONS.filter(c=>c.from===vesselId);
      const toConns = CONNECTIONS.filter(c=>c.to===vesselId);
      if (fromConns.length) {
        logDocs('info', `Outbound (${fromConns.length}):`);
        fromConns.forEach(c => logDocs(c.status==='active'?'ok':c.status==='broken'?'err':'warn', `  → ${lookup[c.to]?.name||c.to} [${c.status}]${c.label?' — '+c.label:''}`));
      }
      if (toConns.length) {
        logDocs('info', `Inbound (${toConns.length}):`);
        toConns.forEach(c => logDocs(c.status==='active'?'ok':c.status==='broken'?'err':'warn', `  ← ${lookup[c.from]?.name||c.from} [${c.status}]${c.label?' — '+c.label:''}`));
      }
      logDocs('info', `═══ END ═══`);
      state.consoleTab = 'docs';
      document.querySelectorAll('.console-tab').forEach(t => t.classList.toggle('active', t.dataset.tab==='docs'));
      renderConsole();
      break;
    }
    case 'test-endpoint': {
      const url = v.endpoint;
      if (!url) { log('warn', `No endpoint for ${v.name}`); return; }
      log('cmd', `› fetch("${url}")`);
      logNetwork('info', `Testing ${url}...`);
      setTimeout(() => {
        if (v.status==='live') {
          const ms = Math.floor(Math.random()*120+10);
          logNetwork('ok', `${url} → 200 OK (${ms}ms) [Content-Type: application/json]`);
          log('ok', `✓ ${v.name} endpoint reachable (${ms}ms)`);
        } else if (v.status==='down') {
          logNetwork('err', `${url} → ECONNREFUSED`);
          log('err', `✗ ${v.name} endpoint unreachable`);
        } else {
          logNetwork('warn', `${url} → 200 OK (slow: ${Math.floor(Math.random()*2000+500)}ms)`);
          log('warn', `⚠ ${v.name} endpoint slow`);
        }
      }, 400 + Math.random()*800);
      break;
    }
  }
}
window.adminAction = adminAction;

          logCaptain('ai', `PRIORITY 5: Audit ${ghosts.length} ghost ships`);
          ghosts.forEach(v => logCaptain('warn', `  ${v.name}: ${v.notes||'purpose unknown'}`));
        }

        setTimeout(() => {
          logCaptain('ai', '─── SEQUENCE ───');
          logCaptain('ok', '1. docker compose up --build (Linux VPS) → restores 5 services');
          logCaptain('ok', '2. Add restart:always to docker-compose.yml → persistence');

      { name: 'ws-service (fanout)', id: 'svc-ws' },
      { name: 'Colyseus (rooms)', id: 'colyseus' },
      { name: 'grudge-game-servers (matchmaking)', id: 'cf-game-servers' },
    ];

    checks.forEach((c, i) => {
      setTimeout(() => {
        const v = lookup[c.id];
        const ok = v?.status === 'live';
        logCaptain(ok ? 'ok' : 'err', `  ${ok?'✓':'✗'} ${c.name} — ${ok?'READY':'NOT READY ('+v?.status+')'}`);

        if (i === checks.length - 1) {
          setTimeout(() => {
            const allReady = checks.every(c => lookup[c.id]?.status === 'live');
            if (allReady) {
              logCaptain('ok', '═══ ALL SYSTEMS GO — Starting PVP matchmaking ═══');
              logCaptain('cmd', '› Colyseus createRoom("ArenaRoom", { mode: "ranked_1v1" })');
            } else {
              const blockers = checks.filter(c => lookup[c.id]?.status !== 'live');
              logCaptain('err', `═══ PVP BLOCKED — ${blockers.length} systems not ready ═══`);
              blockers.forEach(b => logCaptain('err', `  Blocker: ${b.name}`));
              logCaptain('ai', 'CAPTAIN: Recommend running "restart-fleet" to attempt recovery first.');
            }
          }, 400);
        }
      }, i * 300);
    });
  }, 200);
}

/* ════════════════════════════════════════════════════════════════
   COMMAND PARSER
════════════════════════════════════════════════════════════════ */
function parseCommand(input) {
  const parts = input.trim().split(/\s+/);
  const cmd = parts[0]?.toLowerCase();
  const arg = parts.slice(1).join(' ');

  switch(cmd) {
    case 'help':
      log('info', '═══ HARBOR ADMIN COMMANDS ═══');
      log('info', '  help                — Show this help');
      log('info', '  status              — Fleet overview');
      log('info', '  scan                — Full fleet scan');
      log('info', '  captain             — AI Captain diagnosis');
      log('info', '  health <id>         — Health check a vessel');
      log('info', '  restart <id>        — Restart a vessel');
      log('info', '  deploy <id>         — Deploy a vessel');
      log('info', '  logs <id>           — Fetch vessel logs');
      log('info', '  docs <id>           — Show vessel documentation');
      log('info', '  test <id>           — Test vessel endpoint');
      log('info', '  pvp start           — Start PVP server sequence');
      log('info', '  pvp check           — Check PVP readiness');
      log('info', '  restart-fleet       — Restart all down services');
      log('info', '  restart-docker      — Restart Linux VPS Docker stack');
      log('info', '  audit ghosts        — List all unverified vessels');
      log('info', '  find <name>         — Find and select a vessel');
      log('info', '  connections <id>    — List vessel connections');
      log('info', '  broken              — List all broken connections');
      log('info', '  clear               — Clear console');
      log('info', '═══════════════════════════════');
      break;

    case 'status': {
      const counts = {live:0,warn:0,down:0,unknown:0};
      FLEET.forEach(v => counts[v.status]++);
      log('info', `Fleet: ${FLEET.length} vessels`);
      log('ok', `  Live: ${counts.live}`);
      log('warn', `  Degraded: ${counts.warn}`);
      log('err', `  Down: ${counts.down}`);
      log('info', `  Ghost: ${counts.unknown}`);
      log('info', `Connections: ${CONNECTIONS.length} total, ${CONNECTIONS.filter(c=>c.status==='broken').length} broken`);
      break;
    }

    case 'scan': {
      log('cmd', '› Full fleet scan initiated...');
      FLEET.forEach((v, i) => {
        setTimeout(() => {
          const icon = {live:'✓',warn:'⚠',down:'✗',unknown:'?'}[v.status];
          const cls = {live:'ok',warn:'warn',down:'err',unknown:'info'}[v.status];
          log(cls, `  ${icon} ${v.name} [${v.type}] — ${v.status}`);
          if (i === FLEET.length-1) log('info', `Scan complete. ${FLEET.length} vessels inspected.`);
        }, i * 40);
      });
      break;
    }

    case 'captain':
      state.consoleTab = 'captain';
      document.querySelectorAll('.console-tab').forEach(t => t.classList.toggle('active', t.dataset.tab==='captain'));
      captainDiagnose();
      break;

    case 'health':
    case 'restart':
    case 'deploy':
    case 'logs':
    case 'docs':
    case 'test': {
      const id = findVesselId(arg);
      if (!id) { log('err', `Vessel not found: "${arg}". Try "scan" to see all vessels.`); return; }
      const actionMap = {health:'health',restart:'restart',deploy:'deploy',logs:'logs',docs:'docs',test:'test-endpoint'};
      adminAction(actionMap[cmd], id);
      break;
    }

    case 'pvp':
      if (arg === 'start' || arg === 'check') {
        state.consoleTab = 'captain';
        document.querySelectorAll('.console-tab').forEach(t => t.classList.toggle('active', t.dataset.tab==='captain'));
        captainPVP();
      } else log('warn', 'Usage: pvp start | pvp check');
      break;

    case 'restart-fleet': {
      log('cmd', '› Restarting all down services...');
      const down = FLEET.filter(v => v.status==='down' && v.restartCmd);
      if (!down.length) { log('ok', 'No restartable down services.'); return; }
      down.forEach((v, i) => setTimeout(() => adminAction('restart', v.id), i * 2000));
      break;
    }

    case 'restart-docker':
      log('cmd', '› ssh grudge@74.208.155.229 "cd /opt/grudge && docker compose up -d --build"');
      log('info', 'Restarting entire Docker stack on Linux VPS...');
      const dockerSvcs = FLEET.filter(v => v.region==='vps-linux' && v.type==='Docker Service');
      dockerSvcs.forEach((v, i) => {
        setTimeout(() => {
          log('info', `  Starting ${v.name}...`);
          setTimeout(() => {
            const up = Math.random() > 0.3;
            v.status = up ? 'live' : 'down';
            log(up?'ok':'err', `  ${up?'✓':'✗'} ${v.name} — ${up?'UP':'FAILED'}`);
            renderVessels(); updateTopbarStats();
          }, 800);
        }, i * 1500);
      });
      break;

    case 'audit':
      if (arg === 'ghosts') {
        const ghosts = FLEET.filter(v => v.status==='unknown');
        log('info', `${ghosts.length} ghost ships:`);
        ghosts.forEach(v => log('warn', `  ? ${v.name} [${v.type}] — ${v.notes||v.value}`));
      } else log('warn', 'Usage: audit ghosts');
      break;

    case 'find': {
      const id = findVesselId(arg);
      if (!id) { log('err', `Not found: "${arg}"`); return; }
      selectVessel(id);
      log('ok', `Selected: ${lookup[id].name}`);
      break;
    }

    case 'connections': {
      const id = findVesselId(arg);
      if (!id) { log('err', `Not found: "${arg}"`); return; }
      const from = CONNECTIONS.filter(c=>c.from===id);
      const to = CONNECTIONS.filter(c=>c.to===id);
      log('info', `${lookup[id].name} connections:`);
      from.forEach(c => log(c.status==='active'?'ok':'err', `  → ${lookup[c.to]?.name} [${c.status}]`));
      to.forEach(c => log(c.status==='active'?'ok':'err', `  ← ${lookup[c.from]?.name} [${c.status}]`));
      break;
    }

    case 'broken': {
      const broken = CONNECTIONS.filter(c=>c.status==='broken');
      log('err', `${broken.length} broken connections:`);
      broken.forEach(c => log('err', `  ${lookup[c.from]?.name} → ${lookup[c.to]?.name}${c.label?' — '+c.label:''}`));
      break;
    }

    case 'clear':
      consoleLogs[state.consoleTab] = [];
      renderConsole();
      break;

    default:
      log('err', `Unknown command: ${cmd}. Type "help" for available commands.`);
  }
}

function findVesselId(query) {
  if (!query) return null;
  const q = query.toLowerCase().trim();
  // exact id match
  if (lookup[q]) return q;
  // partial name match
  const match = FLEET.find(v => v.id.includes(q) || v.name.toLowerCase().includes(q));
  return match?.id || null;
}

function applyTransform() {
  canvas.style.transform = `translate(${state.panX}px,${state.panY}px) scale(${state.zoom})`;
  document.getElementById('zoomDisplay').textContent = Math.round(state.zoom*100)+'%';
}

function renderRegions() {
  regionsLayer.innerHTML = REGIONS.map(r => `
    <div class="region">
      <div class="region-bounds" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;"></div>
      <div class="region-label" style="left:${r.x+14}px;top:${r.y+10}px;">
        ${r.name}<small>${r.sub}</small>
      </div>
    </div>
  `).join('');
}

function renderConnections() {
  const lines = CONNECTIONS.map((c, i) => {
    const a = lookup[c.from], b = lookup[c.to];
    if (!a || !b) return '';
    const passesFilter = state.filter==='all' || a.status===state.filter || b.status===state.filter;
    const dim = !passesFilter;
    const dx = b.x-a.x, dy = b.y-a.y;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const len = Math.sqrt(dx*dx+dy*dy)||1;
    const offset = Math.min(40, len*0.15);
    const px = -dy/len*offset, py = dx/len*offset;
    const ctrlX = mx+px, ctrlY = my+py;
    const pathId = `conn-${i}`;
    let dots = '';
    if (c.status === 'active' && !dim) {
      const delay = Math.random() * 3;
      dots = `<circle class="data-dot" r="2.5">
        <animateMotion dur="${2+Math.random()*2}s" begin="${delay}s" repeatCount="indefinite">
          <mpath href="#${pathId}"/>
        </animateMotion>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="${2+Math.random()*2}s" begin="${delay}s" repeatCount="indefinite"/>
      </circle>`;
    }
    return `<path id="${pathId}" class="conn-line ${c.status}" d="M ${a.x} ${a.y} Q ${ctrlX} ${ctrlY} ${b.x} ${b.y}"
      data-from="${c.from}" data-to="${c.to}" data-idx="${i}"
      style="${dim?'opacity:0.04':''}"/>${dots}`;
  }).join('');
  connSvg.innerHTML = lines;
}

function renderVessels() {
  vesselsLayer.innerHTML = FLEET.map(v => {
    const passesFilter = state.filter==='all' || v.status===state.filter;
    const muted = !passesFilter;
    return `
      <div class="vessel ${state.selected===v.id?'selected':''} ${muted?'muted':'floating'}"
           data-id="${v.id}" style="left:${v.x}px;top:${v.y}px;">
        ${vesselSvg(v.kind, v.size, v.status)}
        <div class="vessel-status-dot ${v.status}"></div>
        <div class="vessel-label">${v.name}</div>
      </div>`;
  }).join('');

  vesselsLayer.querySelectorAll('.vessel').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const id = el.dataset.id;
      state.selected = state.selected===id ? null : id;
      renderVessels(); renderInspector(); highlightConnections(state.selected);
    });
  });
}

function highlightConnections(id) {
  connSvg.querySelectorAll('.conn-line').forEach(line => {
    if (!id) { line.classList.remove('highlight'); line.style.opacity=''; return; }
    const involves = line.dataset.from===id || line.dataset.to===id;
    line.classList.toggle('highlight', involves);
    line.style.opacity = involves ? '1' : '0.06';
  });
}

function selectVessel(id) {
  state.selected = id;
  renderVessels(); renderInspector(); highlightConnections(id);
  const v = lookup[id];
  if (v) {
    const stageRect = stage.getBoundingClientRect();
    state.panX = stageRect.width/2 - v.x*state.zoom;
    state.panY = stageRect.height/2 - v.y*state.zoom;
    applyTransform();
  }
}
window.selectVessel = selectVessel;
window.parseCommand = parseCommand;

/* ════════════════════════════════════════════════════════════════
   PAN + ZOOM
════════════════════════════════════════════════════════════════ */
let isDragging = false, dragStart = {x:0,y:0,panX:0,panY:0};

stage.addEventListener('mousedown', e => {
  if (e.target.closest('.vessel')||e.target.closest('.conn-item')) return;
  isDragging = true; stage.classList.add('dragging'); canvas.classList.add('no-transition');
  dragStart = {x:e.clientX, y:e.clientY, panX:state.panX, panY:state.panY};
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  state.panX = dragStart.panX + (e.clientX-dragStart.x);
  state.panY = dragStart.panY + (e.clientY-dragStart.y);
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging=false; stage.classList.remove('dragging'); canvas.classList.remove('no-transition'); });

stage.addEventListener('click', e => {
  if (e.target===stage||e.target===canvas||e.target.classList.contains('region-bounds')) {
    state.selected = null;
    renderVessels(); renderInspector(); highlightConnections(null);
  }
});

stage.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = stage.getBoundingClientRect();
  const mx = e.clientX-rect.left, my = e.clientY-rect.top;
  const oldZoom = state.zoom;
  state.zoom = Math.max(0.15, Math.min(2.5, state.zoom*(e.deltaY>0?0.9:1.1)));
  const ratio = state.zoom/oldZoom;
  state.panX = mx-(mx-state.panX)*ratio;
  state.panY = my-(my-state.panY)*ratio;
  applyTransform();
}, {passive:false});

document.getElementById('zoomIn').addEventListener('click', () => { state.zoom=Math.min(2.5,state.zoom*1.2); applyTransform(); });
document.getElementById('zoomOut').addEventListener('click', () => { state.zoom=Math.max(0.15,state.zoom*0.8); applyTransform(); });
document.getElementById('zoomReset').addEventListener('click', centerView);

function centerView() {
  const rect = stage.getBoundingClientRect();
  state.zoom = Math.min(rect.width/3200, rect.height/2400)*0.9;
  state.panX = (rect.width-3200*state.zoom)/2;
  state.panY = (rect.height-2400*state.zoom)/2;
  applyTransform();
}
document.getElementById('centerBtn').addEventListener('click', centerView);

  inspector.classList.toggle('collapsed', !state.inspectorOpen);
  insToggle.classList.toggle('collapsed-state', !state.inspectorOpen);
  insToggle.textContent = state.inspectorOpen ? '›' : '‹';
  stage.classList.toggle('right-collapsed', !state.inspectorOpen);
  consoleDock.classList.toggle('right-collapsed', !state.inspectorOpen);
  zoomPad.classList.toggle('collapsed', !state.inspectorOpen);
});

// Console toggle
function toggleConsole() {
  state.consoleOpen = !state.consoleOpen;
  consoleDock.classList.toggle('collapsed', !state.consoleOpen);
  stage.classList.toggle('console-collapsed', !state.consoleOpen);
  legend.classList.toggle('console-collapsed', !state.consoleOpen);
  zoomPad.classList.toggle('console-collapsed', !state.consoleOpen);
}
document.getElementById('consoleToggle').addEventListener('click', toggleConsole);

// Console tabs
document.querySelectorAll('.console-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.consoleTab = tab.dataset.tab;
    document.querySelectorAll('.console-tab').forEach(t => t.classList.toggle('active', t.dataset.tab===state.consoleTab));
    renderConsole();
  });
});

// Console input
consoleInput.addEventListener('keydown', e => {
  if (e.key==='Enter') {
    const val = consoleInput.value.trim();
    if (!val) return;
    log('cmd', `admiral › ${val}`);
    consoleInput.value = '';
    parseCommand(val);
  }
});

/* ════════════════════════════════════════════════════════════════
   BOOT
════════════════════════════════════════════════════════════════ */
renderRegions();
renderConnections();
renderVessels();
renderInspector();
updateTopbarStats();
centerView();

// Boot log sequence
log('info', '═══ GRUDGE STUDIO · ADMIN HARBOR ═══');
log('info', `Fleet loaded: ${FLEET.length} vessels across ${REGIONS.length} regions`);
log('info', `Connections: ${CONNECTIONS.length} total`);

const counts = {live:0,warn:0,down:0,unknown:0};
FLEET.forEach(v => counts[v.status]++);
log('ok',   `  Live: ${counts.live}`);
log('warn', `  Degraded: ${counts.warn}`);
log('err',  `  Down: ${counts.down}`);
log('info', `  Ghost: ${counts.unknown}`);
log('info', `Broken ropes: ${CONNECTIONS.filter(c=>c.status==='broken').length}`);
log('info', 'Type "help" for commands, "captain" for AI diagnosis.');
logCaptain('ai', 'Legion AI Captain online. Monitoring fleet.');
logCaptain('ai', `${counts.down} vessels down. ${CONNECTIONS.filter(c=>c.status==='broken').length} broken connections detected.`);
logCaptain('ai', 'Type "captain" for full diagnosis and recommended actions.');
</script>
