<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraForge - Grudge Studio</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;color:#fff;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;height:100vh}
.loader{text-align:center;background:rgba(0,0,0,0.7);padding:40px;border-radius:12px}
.loader h1{color:#4da73d;font-size:2.5rem;text-shadow:3px 3px 0 #000;margin-bottom:10px}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#4da73d;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px;font-size:12px;color:#aaa}
.feat{background:rgba(255,255,255,0.1);padding:8px;border-radius:6px;text-align:center}
</style>
<script src="/vendor/three.min.js"></script>
</head>
<body>
<div class="loader">
<h1>TERRAFORGE</h1>
<div class="spinner"></div>
<p>Loading Open World Voxel Engine...</p>
<div class="features">
<div class="feat">Voxel Terrain</div>
<div class="feat">FPS Combat</div>
<div class="feat">City Builder</div>
<div class="feat">NPC AI</div>
<div class="feat">World Editor</div>
<div class="feat">Coin System</div>
<div class="feat">Castle Fortress</div>
<div class="feat">Item Shop</div>
<div class="feat">World Map</div>
</div>
<p style="color:#555;margin-top:20px;font-size:12px">Full game HTML to be deployed from source</p>
</div>
<script>
// Grudge Auth + Settings Bridge
let __settings = {};
window.addEventListener('message', (e) => {
  if (e.data?.type === 'grudge:auth') {
    window.__GRUDGE_PLAYER__ = e.data.player;
    window.__GRUDGE_TOKEN__ = e.data.token;
  }
  if (e.data?.type === 'grudge:settings') {
    __settings = e.data.settings;
    // Apply crosshair, mouse invert, run mode etc. when game loads
    if (window.applyGrudgeSettings) window.applyGrudgeSettings(__settings);
  }
});
if (window.parent !== window) {
  window.parent.postMessage({ type: 'grudge:game:ready', game: 'terraforge' }, '*');
}
</script>
</body>
</html>
