<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<script src="/grudge-game-bootstrap.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TerraForge - Grudge Studio</title>
<style>
body{margin:0;overflow:hidden;background:#87CEEB;color:#fff;font-family:system-ui,sans-serif}
.loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#87CEEB;z-index:30}
.loader h1{color:#2d6b2d;font-size:2rem;text-shadow:2px 2px 0 #000}
.spinner{width:36px;height:36px;border:3px solid #333;border-top-color:#4da73d;border-radius:50%;animation:spin 1s linear infinite;margin-top:12px}
@keyframes spin{to{transform:rotate(360deg)}}
#crosshair{position:fixed;pointer-events:none;z-index:20;transform:translate(-50%,-50%)}
#hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;background:rgba(0,0,0,0.55);border-radius:8px;font-size:14px;z-index:15}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div class="loader"><h1>TERRAFORGE</h1><div class="spinner"></div></div>
<div id="hint">Click to play · WASD move · Mouse look · Shift sprint</div>
<div id="crosshair"></div>
<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { installAuthBridge, createHud, removeLoader } from './shared.mjs';

installAuthBridge('terraforge');

let settings = {
  crosshairStyle: 'dot', crosshairColor: '#ff0000', crosshairSize: 4,
  mouseInvert: false, mouseSensitivity: 1.0, runMode: 'hold',
  drawDistance: 100, enableNPC: true, hostileNPC: true,
  enableShadows: false, textureMode: 'simple', firstPerson: false,
};

window.applyGrudgeSettings = (s) => {
  settings = { ...settings, ...s };
  drawCrosshair();
  scene.fog.far = settings.drawDistance;
  camera.far = settings.drawDistance + 20;
  camera.updateProjectionMatrix();
  renderer.shadowMap.enabled = settings.enableShadows;
};

const crosshairEl = document.getElementById('crosshair');
function drawCrosshair() {
  const s = settings.crosshairSize;
  const c = settings.crosshairColor;
  if (settings.crosshairStyle === 'cross') {
    crosshairEl.style.cssText = `left:50%;top:50%;width:${s*3}px;height:${s*3}px;border:none;background:linear-gradient(${c},${c}) center/2px 100% no-repeat,linear-gradient(90deg,${c},${c}) center/100% 2px no-repeat;`;
  } else if (settings.crosshairStyle === 'circle') {
    crosshairEl.style.cssText = `left:50%;top:50%;width:${s*2}px;height:${s*2}px;border:2px solid ${c};border-radius:50%;background:transparent;`;
  } else {
    crosshairEl.style.cssText = `left:50%;top:50%;width:${s}px;height:${s}px;background:${c};border-radius:50%;`;
  }
}
drawCrosshair();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 20, settings.drawDistance);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, settings.drawDistance + 20);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new PointerLockControls(camera, document.body);
const player = new THREE.Object3D();
player.add(camera);
camera.position.set(0, 1.6, 0);
scene.add(player);
player.position.set(8, 4, 8);

scene.add(new THREE.AmbientLight(0xffffff, 0.65));
const sun = new THREE.DirectionalLight(0xfff4d6, 1.0);
sun.position.set(40, 60, 20);
scene.add(sun);

const blocks = [];
const colors = [0x4a7c3f, 0x6b8e23, 0x8b7355, 0x5f7f8a, 0x3e5f3a];
for (let x = -24; x <= 24; x++) {
  for (let z = -24; z <= 24; z++) {
    const h = Math.max(0, Math.floor(2 + Math.sin(x * 0.25) * 2 + Math.cos(z * 0.2) * 2 + (Math.random() * 0.8)));
    for (let y = 0; y <= h; y++) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshLambertMaterial({ color: colors[(x + z + y) % colors.length] })
      );
      mesh.position.set(x, y + 0.5, z);
      scene.add(mesh);
      blocks.push(mesh);
    }
  }
}

const npcs = [];
if (settings.enableNPC) {
  for (let i = 0; i < 6; i++) {
    const npc = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 1.6, 0.8),
      new THREE.MeshLambertMaterial({ color: settings.hostileNPC ? 0xaa3333 : 0x3366aa })
    );
    npc.position.set((Math.random() - 0.5) * 30, 3, (Math.random() - 0.5) * 30);
    scene.add(npc);
    npcs.push({ mesh: npc, vx: (Math.random() - 0.5) * 0.04, vz: (Math.random() - 0.5) * 0.04 });
  }
}

const keys = {};
const velocity = new THREE.Vector3();
const direction = new THREE.Vector3();
let sprint = false;
const hud = createHud(['<b>TerraForge</b> voxel world', 'LMB break · RMB place · E interact']);

addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (settings.runMode === 'toggle' && e.code === 'ShiftLeft') sprint = !sprint;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const hint = document.getElementById('hint');
renderer.domElement.addEventListener('click', () => {
  controls.lock();
  hint.style.display = 'none';
});
controls.addEventListener('lock', () => { hint.style.display = 'none'; });
controls.addEventListener('unlock', () => { hint.style.display = 'block'; });

const raycaster = new THREE.Raycaster();
addEventListener('mousedown', (e) => {
  if (!controls.isLocked) return;
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hit = raycaster.intersectObjects(blocks, false)[0];
  if (!hit) return;
  if (e.button === 0) {
    scene.remove(hit.object);
    blocks.splice(blocks.indexOf(hit.object), 1);
  } else if (e.button === 2) {
    const n = hit.face.normal;
    const p = hit.object.position.clone().add(n);
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshLambertMaterial({ color: 0x8b5a2b })
    );
    mesh.position.copy(p);
    scene.add(mesh);
    blocks.push(mesh);
  }
});

let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (controls.isLocked) {
    const speed = (settings.runMode === 'hold' ? keys.ShiftLeft : sprint) ? 14 : 8;
    velocity.x -= velocity.x * 8 * dt;
    velocity.z -= velocity.z * 8 * dt;
    direction.set((keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), 0, (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0));
    if (direction.lengthSq() > 0) direction.normalize();
    velocity.x += direction.x * speed * dt;
    velocity.z += direction.z * speed * dt;
    controls.moveRight(velocity.x);
    controls.moveForward(velocity.z);
    player.position.y = 3 + Math.sin(now * 0.002) * 0.05;
  }
  npcs.forEach((n) => {
    n.mesh.position.x += n.vx;
    n.mesh.position.z += n.vz;
    if (Math.abs(n.mesh.position.x) > 20) n.vx *= -1;
    if (Math.abs(n.mesh.position.z) > 20) n.vz *= -1;
  });
  renderer.render(scene, camera);
}

removeLoader();
requestAnimationFrame(tick);
</script>
</body>
</html>
