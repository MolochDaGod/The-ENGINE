name = "grudge-auth-gateway"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
BACKEND_URL = "https://grudge-studio.com"
ALLOWED_ORIGINS = "https://grudge-studio.com,https://grudgewarlords.com,https://grudgeplatform.io,https://dungeon-crawler-quest.vercel.app,https://grudgestudio.puter.site,https://grudgeplatform.puter.site,http://localhost:5173,http://localhost:5000"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_GRUDGE_SESSIONS_KV_ID"

[routes]
pattern = "auth.grudge-studio.com/*"
