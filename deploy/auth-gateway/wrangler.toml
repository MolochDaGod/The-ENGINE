name = "grudge-identity-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Canonical Grudge ID API (grudge-builder Railway)
AUTH_UPSTREAM = "https://grudge-api-production-0d46.up.railway.app"
# Legacy — non-auth id host paths only
BACKEND_URL = "https://the-engine.up.railway.app"
PORTAL_ORIGIN = "https://grudge-studio.com"
ALLOWED_ORIGINS = "https://grudge-studio.com,https://id.grudge-studio.com,https://nexus.grudge-studio.com,https://grudgewarlords.com,https://grudgeplatform.com,https://dungeon-crawler-quest.vercel.app,https://warlord-crafting-suite.vercel.app,https://grudgestudio.puter.site,https://grudge-studio.puter.site,https://grudgeplatform.puter.site,https://puter.com,https://app.puter.com,https://grudge-crafting.puter.site,https://dash.grudge-studio.com,https://wallet.grudge-studio.com,https://client.grudge-studio.com,http://localhost:5173,http://localhost:5000"

# KV namespace – create one in Cloudflare and replace the id if needed
# [[kv_namespaces]]
# binding = "SESSIONS"
# id = "REPLACE_WITH_GRUDGE_SESSIONS_KV_ID"

[[routes]]
# Identity / auth hub only — portal stays on Vercel (grudge-studio.com)
pattern = "id.grudge-studio.com/*"
zone_name = "grudge-studio.com"
