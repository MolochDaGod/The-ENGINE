name = "grudge-game-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[vars]
# Player JSON SSOT. Do NOT use the-engine (portal SPA) or grudge-api-production (HTML ghost).
BACKEND_URL = "https://grudge-api-production-0d46.up.railway.app"
ALLOWED_ORIGINS = "https://grudgewarlords.com,https://www.grudgewarlords.com,https://client.grudge-studio.com,https://grudge-studio.com,https://id.grudge-studio.com,https://coder.grudge-studio.com,https://dash.grudge-studio.com,https://open.grudge-studio.com,https://grudox.grudge-studio.com,https://forge.grudge-studio.com,https://character.grudge-studio.com,https://grudge-studio-dash.pages.dev,https://grudgedot.pages.dev,https://grudge-crafting.puter.site,https://grudgewarlords.puter.site,https://grudgestudio.puter.site,https://grudgeplatform.com,https://wallet.grudge-studio.com,https://molochdagod.github.io,https://puter.com,https://app.puter.com,http://localhost:5173,http://localhost:5000"

# Lobby/matchmake via service binding (paths /lobby*, /lobbies)
[[services]]
binding = "GAME_SERVERS"
service = "grudge-game-servers"

# Route: api.grudge-studio.com → this Worker → Railway (+ game-servers for lobbies)
[[routes]]
pattern = "api.grudge-studio.com/*"
zone_name = "grudge-studio.com"
